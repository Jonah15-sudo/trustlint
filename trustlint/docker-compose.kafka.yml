# TrustLint Kafka Infrastructure — DEVELOPMENT ONLY
#
# WARNING: This configuration is INSECURE and intended ONLY for local development.
# It uses anonymous access, plaintext transport, auto topic creation, and
# single-node setup. DO NOT use in production.
#
# For production, see docker-compose.production.example.yml
#
# Start: docker compose -f docker-compose.kafka.yml up
#
services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "127.0.0.1:2181:2181"
    # SECURITY: Bind to localhost only — do not expose to network

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    # SECURITY: Bind to localhost only — do not expose to network
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
