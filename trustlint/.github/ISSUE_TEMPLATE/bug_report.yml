name: Bug Report
description: Report a bug in TrustLint
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the issue.
      placeholder: |
        1. Run `trustlint ...`
        2. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include full error output if available.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Provide your environment details. Run `trustlint --version` and `python --version`.
      placeholder: |
        - TrustLint version:
        - Python version:
        - OS:
    validations:
      required: true

  - type: input
    id: exit-code
    attributes:
      label: Exit Code
      description: "If the command exited with a non-zero code, provide it here."
      placeholder: e.g. 1, 2, 64
    validations:
      required: false
