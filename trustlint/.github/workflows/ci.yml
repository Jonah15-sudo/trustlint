name: CI

on:
  push:
    branches: [master, "hardening/*"]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m py_compile trustlint/cli.py
      - run: uv run python -m py_compile trustlint/analyzer.py
      - run: uv run python -m py_compile trustlint/infrastructure/ocsp/client.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev --extra crypto
      - name: Run offline-safe tests
        run: uv run pytest -m "not network and not slow" -q --tb=short
      - name: Verify clean install (import check)
        run: uv run python -c "from trustlint import analyze, get_version; print(f'trustlint {get_version()}')"
